; Export presets for Pixel Estates.
;
; These describe HOW to export once a developer has the required local
; tooling installed - they do not, by themselves, produce an .apk/.ipa.
; Actually building requires (and could not be installed/verified in the
; environment this project was authored in):
;   Android: Android SDK + Godot's Android export templates + a signing
;            keystore (`android/keystore/release` below is a placeholder
;            path, not a committed keystore file - never commit a real one).
;   iOS:     Xcode on macOS + Godot's iOS export templates + an Apple
;            Developer Program membership, provisioning profile, and
;            signing certificate.
; See README.md "Mobile export" for the exact steps once you have those.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/android/pixel-estates.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

